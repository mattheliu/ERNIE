name: Docs Preview & Markdown Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  markdown-lint:
    name: Run Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pymarkdown
        run: pip install pymarkdownlnt

      - name: Lint Markdown
        run: |
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.md$' || true)
          if [ -z "$files" ]; then
            echo "No markdown files changed."
            exit 0
          fi
          pymarkdown scan $files

  docs-preview:
    name: Show Docs Preview
    needs: markdown-lint
    runs-on: ubuntu-latest

    steps:
      - name: Compute RTD Preview URL
        id: url
        run: |
          PR=${{ github.event.pull_request.number }}
          echo "url=https://ernie--pr$PR.readthedocs.io" >> $GITHUB_OUTPUT

      - name: Comment preview link
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-preview
          message: |
            ${{ steps.url.outputs.url }}
