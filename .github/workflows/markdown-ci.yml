name: Docs Quality Gate

on:
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect Docs Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      md_files: ${{ steps.collect.outputs.files }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'

      - name: Collect changed markdown files
        id: collect
        shell: bash
        run: |
          if [ "${{ steps.filter.outputs.docs }}" != "true" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^docs/.*\.md$' || true)
          files=$(printf '%s' "$files" | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

  markdown:
    name: Markdown Lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pymarkdown
        run: |
          python -m pip install --upgrade pip
          pip install pymarkdownlnt

      - name: Run Markdown Lint
        shell: bash
        run: |
          files="${{ needs.changes.outputs.md_files }}"

          if [ -z "$files" ]; then
            echo "No markdown files to lint."
            exit 0
          fi

          echo "Linting:"
          echo "$files"

          pymarkdown scan $files

  docs-preview:
    name: Docs Build & Preview
    needs: markdown
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build MkDocs
        run: |
          mkdocs build --config-file docs/mkdocs.yml

      - name: Publish Preview Comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const repo = context.repo;
            const previewUrl = `https://${pr}.ernie.readthedocs.io`;

            const body = `### 📚 Documentation Preview\n\n🔗 ${previewUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: pr,
            });

            const existing = comments.find(c => c.body.startsWith('### 📚 Documentation Preview'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: repo.owner,
                repo: repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: pr,
                body,
              });
            }
