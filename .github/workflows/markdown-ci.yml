name: Docs Quality Gate

on:
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect Docs Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      md_files: ${{ steps.filter.outputs.md_files }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
            md_files:
              - 'docs/**/*.md'

  markdown:
    name: Markdown Lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pymarkdown
        run: |
          python -m pip install --upgrade pip
          pip install pymarkdownlnt

      - name: Run Markdown Lint
        shell: bash
        run: |
          echo "Linting changed markdown files:"

          files="${{ needs.changes.outputs.md_files }}"

          # Print nicely
          printf '%s\n' "$files"

          # Convert to single-line argument list
          files="$(printf '%s\n' "$files" | tr '\n' ' ')"

          if [ -z "$files" ]; then
            echo "No markdown files to lint."
            exit 0
          fi

          pymarkdown scan $files

  docs-preview:
    name: Docs Build Preview
    needs: markdown
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build MkDocs
        run: |
          mkdocs build --config-file docs/mkdocs.yml --site-dir site

      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: site

      - name: Comment PR with preview info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const repo = context.repo;
            const pr = context.payload.pull_request.number;

            const body = `
            ### 📚 Documentation Preview Ready

            Your documentation has been successfully built.

            **Preview artifact:**  
            Go to **Checks → Artifacts → docs-preview** in this workflow run.

            🔗 Workflow Run: https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId}`;

            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: pr,
              body: body,
            });
