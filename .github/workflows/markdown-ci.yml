name: Markdown Lint & Docs Preview

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pymarkdown
        run: |
          pip install pymarkdownlnt

      - name: Run Markdown Lint
        run: |
          pymarkdown scan source/

  docs-preview:
    name: Docs Build Preview
    runs-on: ubuntu-latest
    needs: markdown

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Build MkDocs
        run: |
          mkdocs build --config-file docs/mkdocs.yml --site-dir site

      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: site
