name: Docs Quality Gate1

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect Docs Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      md_files: ${{ steps.filter.outputs.md_files }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
            md_files:
              - 'docs/**/*.md'

  markdown:
    name: Markdown Lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pymarkdown
        run: |
          python -m pip install --upgrade pip
          pip install pymarkdownlnt

      - name: Run Markdown Lint
        shell: bash
        run: |
          echo "Linting changed markdown files:"
          files="${{ needs.changes.outputs.md_files }}"

          printf '%s\n' "$files"

          files="$(printf '%s\n' "$files" | tr '\n' ' ')"

          if [ -z "$files" ]; then
            echo "No markdown files to lint."
            exit 0
          fi

          pymarkdown scan $files

  docs-preview:
    name: Docs Build Preview
    needs: markdown
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build MkDocs
        run: |
          cd docs
          mkdocs build

      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs/site

      - name: Comment PR with Preview Links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;

            const previewURL = `https://ernie--pr-${prNumber}.readthedocs.io`;

            const body = `
            ### 📚 Documentation Preview
            
            🌐 **ReadTheDocs PR Preview (official)**
            ${previewURL}
            
            > ReadTheDocs PR preview is automatically generated after this PR is created and may take a few minutes to become available.
            > This comment auto-updates on every commit.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('### 📚 Documentation Preview'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
