name: Docs Quality Gate

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  markdown:
    name: Markdown Lint (PR Diff Only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pymarkdown
        run: |
          python -m pip install --upgrade pip
          pip install pymarkdownlnt

      - name: Get changed markdown files
        id: md-files
        run: |
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.md$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Markdown Lint
        if: steps.md-files.outputs.files != ''
        run: |
          echo "Linting changed markdown files:"
          echo "${{ steps.md-files.outputs.files }}"
          pymarkdown scan ${{ steps.md-files.outputs.files }}

      - name: Skip lint (no markdown changed)
        if: steps.md-files.outputs.files == ''
        run: echo "No markdown changes detected."

  docs-preview:
    name: Docs Build Preview
    runs-on: ubuntu-latest
    needs: markdown

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build MkDocs
        run: |
          mkdocs build --config-file docs/mkdocs.yml --site-dir site

      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: site

      - name: Comment PR with preview info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const repo = context.repo;
            const pr = context.payload.pull_request.number;

            const body = `
            ### 📚 Documentation Preview Ready

            Your documentation has been successfully built.

            **Preview artifact:**  
            Go to **Checks → Artifacts → docs-preview** in this workflow run.

            🔗 Workflow Run: https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId}`;

            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: pr,
              body: body,
            });
