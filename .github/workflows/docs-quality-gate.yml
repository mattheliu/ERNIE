name: Docs Quality Gate

on:
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  pull-requests: write

env:
  RTD_PROJECT: ernie

jobs:
  changes:
    name: Detect Docs Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      md_files: ${{ steps.filter.outputs.md_files }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
            md_files:
              - 'docs/**/*.md'

  markdown:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    name: Markdown Lint

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pymarkdownlnt

      - name: Lint changed files
        run: |
          files="${{ needs.changes.outputs.md_files }}"
          [ -z "$files" ] && exit 0
          pymarkdown scan $files

  docs-build:
    needs: markdown
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    name: Validate MkDocs Build

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r docs/requirements.txt
          mkdocs build --config-file docs/mkdocs.yml

  deploy-rtd:
    needs: docs-build
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    name: Trigger ReadTheDocs Build

    steps:
      - name: Trigger RTD build
        id: trigger
        run: |
          response=$(curl -s -X POST \
            -H "Authorization: Token ${{ secrets.RTD_TOKEN }}" \
            https://readthedocs.org/api/v3/projects/${{ env.RTD_PROJECT }}/versions/latest/builds/)
          echo "build_id=$(echo "$response" | jq -r '.id')" >> $GITHUB_OUTPUT

      - name: Wait for build
        run: |
          for i in {1..30}; do
            status=$(curl -s \
              -H "Authorization: Token ${{ secrets.RTD_TOKEN }}" \
              https://readthedocs.org/api/v3/builds/${{ steps.trigger.outputs.build_id }}/ | jq -r '.state')
            echo "RTD status: $status"
            [ "$status" = "finished" ] && exit 0
            sleep 10
          done
          exit 1

  comment:
    needs: deploy-rtd
    runs-on: ubuntu-latest
    name: Update PR Comment

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = "### 📚 Documentation Preview Ready";
            const body = `${marker}

            Your changes are now live on ReadTheDocs:

            🔗 **https://${process.env.RTD_PROJECT}.readthedocs.io**

            This comment will be updated automatically on new commits.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
